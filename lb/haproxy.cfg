global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2

# Página de estatísticas — útil para observar ejection/readmissão em tempo real
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend http_in
    # Porta 8080 em vez de 80: containers rootless (padrão no Podman Desktop
    # em Windows/WSL2) não conseguem abrir portas < 1024 sem configuração
    # extra de capabilities no host. 8080 evita esse problema por completo.
    bind *:8080
    default_backend alvo_pool

backend alvo_pool
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # inter 2s : checa cada réplica a cada 2 segundos
    # fall 3   : 3 falhas consecutivas -> réplica DOWN (ejetada)
    # rise 2   : 2 sucessos consecutivos -> réplica UP (readmitida)
    default-server inter 2s fall 3 rise 2 maxconn 200
    # IPs fixos em vez de hostnames: evita falha de resolução DNS na
    # inicialização do HAProxy em alguns ambientes Podman.
    server target-1 10.20.0.11:8000 check
    server target-2 10.20.0.12:8000 check
    server target-3 10.20.0.13:8000 check
