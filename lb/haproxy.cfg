global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    retries 2

# Página de estatísticas — útil para observar ejection/readmissão em tempo real
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 2s

frontend http_in
    bind *:80
    default_backend alvo_pool

backend alvo_pool
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    # inter 2s : checa cada réplica a cada 2 segundos
    # fall 3   : 3 falhas consecutivas -> réplica DOWN (ejetada)
    # rise 2   : 2 sucessos consecutivos -> réplica UP (readmitida)
    default-server inter 2s fall 3 rise 2 maxconn 200
    server target-1 target-1:8000 check
    server target-2 target-2:8000 check
    server target-3 target-3:8000 check
